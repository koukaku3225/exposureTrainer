<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #f3eee4; font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif; color: #2b2925; }
    a { color: #3b4a6b; } a:hover { color: #26324a; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f3eee4; display: flex; flex-direction: column; background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(59,74,107,0.07) 31px 32px);">
  <div style="flex-grow: 1; padding: 52px 24px 0; display: flex; flex-direction: column; gap: 22px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 13px; letter-spacing: 0.08em; color: #7a7366;">9月14日（月）</div>
      <div style="font-family: 'Zen Old Mincho', serif; font-size: 28px; font-weight: 700; line-height: 1.3;">今日の一歩</div>
    </div>

    <div style="background: #fbf8f2; border: 1px solid #d9d0bf; border-radius: 4px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 0 #e6ddcc;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 13px; color: #7a7366;">人前で話す</div>
        <div style="font-family: 'Zen Old Mincho', serif; font-size: 14px; color: #3b4a6b; border: 1px solid #3b4a6b; border-radius: 2px; padding: 2px 8px;">難しさ 3</div>
      </div>
      <div style="font-family: 'Zen Old Mincho', serif; font-size: 22px; font-weight: 700; line-height: 1.5; text-wrap: pretty;">会議で一言だけ発言する</div>
      <div style="display: flex; gap: 24px; font-size: 14px; color: #4d483f;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 12px; color: #7a7366;">実践した回数</div>
          <div><span style="font-family: 'Zen Old Mincho', serif; font-size: 24px; color: #2b2925;">2</span> / 3 回</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 12px; color: #7a7366;">前回の不安</div>
          <div><span style="font-family: 'Zen Old Mincho', serif; font-size: 24px; color: #2b2925;">6 → 4</span></div>
        </div>
      </div>
      <div style="font-size: 13px; line-height: 1.7; color: #7a7366; border-top: 1px dashed #d9d0bf; padding-top: 12px;">あと1回。終わった後の不安が3以下になったら、次の段に進めます。</div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; height: 56px; background: #3b4a6b; color: #f7f3ea; border-radius: 4px; font-size: 16px; font-weight: 700; letter-spacing: 0.06em;">実践を記録する</div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div style="padding: 14px 16px; border-top: 2px solid #2b2925; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 12px; color: #7a7366;">今週の実践</div>
        <div style="font-family: 'Zen Old Mincho', serif; font-size: 26px;">5 <span style="font-size: 14px;">回</span></div>
      </div>
      <div style="padding: 14px 16px; border-top: 2px solid #2b2925; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 12px; color: #7a7366;">ポイント</div>
        <div style="font-family: 'Zen Old Mincho', serif; font-size: 26px;">34 <span style="font-size: 14px;">pt</span></div>
        <div style="font-size: 12px; color: #7a7366;">あと16ptで 新しい服</div>
      </div>
    </div>
  </div>

  <div style="height: 76px; border-top: 1px solid #d9d0bf; background: #f7f3ea; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 12px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #3b4a6b; font-size: 11px; font-weight: 700;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11l8-6 8 6v8h-5v-5H9v5H4z"></path></svg>ホーム</div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8a8375; font-size: 11px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19h5v-4h5v-4h6"></path></svg>段階表</div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8a8375; font-size: 11px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 4h12v16H6z"></path><path d="M9 9h6M9 13h6"></path></svg>記録</div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8a8375; font-size: 11px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 18l5-6 4 3 7-9"></path></svg>振り返り</div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8a8375; font-size: 11px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path></svg>設定</div>
  </div>
</div>
</x-dc>
</body>
</html>
