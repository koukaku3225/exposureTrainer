<!doctype html>

<x-dc>
<helmet>

  <style>

  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fff; display: flex; flex-direction: column;">
  <div style="flex-grow: 1; padding: 44px 18px 8px; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">

    <div style="display: flex; align-items: center; justify-content: space-between;">

        <div style="font-weight: 800; font-size: 15px; color: #b5650a;">5日</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; background: #f2effe; border-radius: 999px; padding: 6px 14px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#6c4bff"><path d="M12 2l2.6 6.6L21 9l-5 4.6L17.4 21 12 17.3 6.6 21 8 13.6 3 9l6.4-.4z"></path></svg>
        <div style="font-weight: 800; font-size: 15px; color: #6c4bff;">34</div>
      </div>
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #f5f4fb; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b87a8" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"></path></svg>
      </div>
    </div>

    <div style="background: linear-gradient(135deg, #f2effe 0%, #eafbf3 100%); border-radius: 22px; padding: 16px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 48px; height: 48px; border-radius: 16px; background: #6c4bff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"></path></svg>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 12px; font-weight: 700; color: #6c4bff;">レベル3・難しさ3</div>
        <div style="font-size: 15px; font-weight: 800; line-height: 1.3;">会議で一言だけ発言する</div>
      </div>
    </div>

    <div style="position: relative; flex-grow: 1; min-height: 0;">
      <svg width="354" height="420" viewBox="0 0 354 420" style="position: absolute; left: 0; top: 0;" fill="none">
        <path d="M60 400 C60 350 140 350 140 310 S60 270 60 220 S160 190 160 140 S250 130 250 90 S300 60 300 20" stroke="#eceafc" stroke-width="14" stroke-linecap="round"></path>
      </svg>
      <div style="position: absolute; left: 34px; top: 372px; width: 52px; height: 52px; border-radius: 26px; background: #22b573; box-shadow: 0 4px 0 #17864f; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"></path></svg></div>
      <div style="position: absolute; left: 114px; top: 282px; width: 52px; height: 52px; border-radius: 26px; background: #22b573; box-shadow: 0 4px 0 #17864f; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"></path></svg></div>
      <div style="position: absolute; left: 34px; top: 192px; width: 64px; height: 64px; border-radius: 32px; background: #6c4bff; box-shadow: 0 6px 0 #4d33c9, 0 0 0 6px #ece6ff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #fff;">3</div>
      <div style="position: absolute; left: 134px; top: 112px; width: 52px; height: 52px; border-radius: 26px; background: #efeef7; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #b5b1d0; font-size: 18px;">4</div>
      <div style="position: absolute; left: 224px; top: 62px; width: 52px; height: 52px; border-radius: 26px; background: #efeef7; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #b5b1d0; font-size: 18px;">5</div>
      <div style="position: absolute; left: 274px; top: -4px; width: 56px; height: 56px; border-radius: 28px; background: #fff2e0; border: 3px solid #ff9500; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="#ff9500"><path d="M12 2l2.6 6.6L21 9l-5 4.6L17.4 21 12 17.3 6.6 21 8 13.6 3 9l6.4-.4z"></path></svg></div>
      <div style="position: absolute; left: 40px; top: 148px; width: 88px; background: #1a1523; color: #fff; font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 10px; text-align: center; line-height: 1.4;">会議で一言だけ発言する</div>
    </div>

    <div style="height: 56px; border-radius: 999px; background: #6c4bff; box-shadow: 0 6px 0 #4d33c9; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 800; color: #fff;">いどむ</div>
  </div>

  <div style="height: 78px; box-sizing: border-box; padding-bottom: 12px; border-top: 1px solid #f1f0f8; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6c4bff; font-size: 10px; font-weight: 800;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6c4bff" stroke-width="2.2" stroke-linecap="round"><path d="M4 11l8-6 8 6v8h-5v-5H9v5H4z"></path></svg>ホーム</div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #b5b1d0; font-size: 10px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b5b1d0" stroke-width="1.8" stroke-linecap="round"><path d="M4 19h5v-4h5v-4h6"></path></svg>段階表</div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #b5b1d0; font-size: 10px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b5b1d0" stroke-width="1.8" stroke-linecap="round"><path d="M4 19V9M11 19V4M18 19v-7"></path></svg>振り返り</div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #b5b1d0; font-size: 10px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b5b1d0" stroke-width="1.8" stroke-linecap="round"><path d="M12 21s-7-4.5-9.5-9C.5 8 3 5 6.5 5 9 5 11 7 12 8.5 13 7 15 5 17.5 5 21 5 23.5 8 21.5 12 19 16.5 12 21 12 21z"></path></svg>チェック</div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #b5b1d0; font-size: 10px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b5b1d0" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path></svg>設定</div>
  </div>
</div>
</x-dc>
</body>
</html>
