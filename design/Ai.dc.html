<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
  <style>
    body { margin: 0; background: #fff8f0; font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif; color: #3a2a17; }

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fff8f0; display: flex; flex-direction: column;">
  <div style="flex-grow: 1; padding: 44px 18px 8px; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">

    <div style="display: flex; flex-direction: column;"><div style="font-size: 20px; font-weight: 900;">AIに課題を作らせる</div></div>
    <div style="background: #fff; border-radius: 18px; padding: 16px; box-shadow: 0 2px 10px rgba(58,42,23,0.05); display: flex; flex-direction: column; gap: 10px;">
      <div style="border-radius: 12px; padding: 12px; background: #fff8f0; border: 1px solid #ffe9db; font-size: 13.5px; line-height: 1.6;">大学の同期との飲み会で、自分から話を振るのが怖い</div>
      <div style="height: 54px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800; background: #ff6f3c; color: #fff; box-shadow: 0 5px 0 #d84a1a;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 2v5M12 17v5M2 12h5M17 12h5M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"></path></svg>課題を作ってもらう</div>
      <div style="font-size: 11.5px; color: #b09378;">段階表に入れるものを選ぶ（難しさはあとで変更可）</div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 13.5px;"><div style="width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #ff6f3c;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 12l5 5L20 6"></path></svg></div><div style="font-weight: 900; color: #ff6f3c; width: 16px;">2</div><div>乾杯のあと隣の人に一言感想を言う</div></div><div style="display: flex; align-items: center; gap: 10px; font-size: 13.5px;"><div style="width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #ff6f3c;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 12l5 5L20 6"></path></svg></div><div style="font-weight: 900; color: #ff6f3c; width: 16px;">3</div><div>相手に質問を1つする</div></div><div style="display: flex; align-items: center; gap: 10px; font-size: 13.5px;"><div style="width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1.5px solid #ffd9b8;"></div><div style="font-weight: 900; color: #ff6f3c; width: 16px;">5</div><div>自分の近況を30秒話す</div></div><div style="display: flex; align-items: center; gap: 10px; font-size: 13.5px;"><div style="width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #ff6f3c;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 12l5 5L20 6"></path></svg></div><div style="font-weight: 900; color: #ff6f3c; width: 16px;">6</div><div>次の集まりを自分から提案する</div></div>
      <div style="height: 54px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800; background: #fff; color: #ff6f3c; border: 1.5px solid #ffe0cc;">選んだ3つを段階表に入れる</div>
    </div>
    <div style="background: #fff; border-radius: 18px; padding: 16px; box-shadow: 0 2px 10px rgba(58,42,23,0.05); display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 6px 0;"><div style="width: 38px; height: 38px; border-radius: 12px; background: #ffe9db; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d84a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"></path></svg></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;"><div style="font-size: 14.5px; font-weight: 700;">次の段へ進む目安</div></div><div style="font-size: 12.5px; color: #b09378;">3回・不安3以下</div></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 6px 0;"><div style="width: 38px; height: 38px; border-radius: 12px; background: #ffe9db; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d84a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 3l2.7 5.9L21 9.8l-4.5 4.2L17.7 21 12 17.6 6.3 21l1.2-7-4.5-4.2 6.3-.9L12 3z"></path></svg></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;"><div style="font-size: 14.5px; font-weight: 700;">ごほうびの設定</div></div><div style="font-size: 12.5px; color: #b09378;">3件</div></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 6px 0;"><div style="width: 38px; height: 38px; border-radius: 12px; background: #ffe9db; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d84a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 19V9M11 19V4M18 19v-7"></path></svg></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;"><div style="font-size: 14.5px; font-weight: 700;">データの書き出し／読み込み</div></div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d6b89e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 6px 0;"><div style="width: 38px; height: 38px; border-radius: 12px; background: #ffe9db; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d84a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 21s-7-4.5-9.5-9C.5 8 3 5 6.5 5 9 5 11 7 12 8.5 13 7 15 5 17.5 5 21 5 23.5 8 21.5 12 19 16.5 12 21 12 21z"></path></svg></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;"><div style="font-size: 14.5px; font-weight: 700;">はじめに読む注意</div></div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d6b89e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></div>
    </div>
  
  </div>
  <div style="height: 78px; box-sizing: border-box; padding-bottom: 12px; border-top: 1px solid #ffe9db; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #d6b89e; font-size: 10px; font-weight: 500;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d6b89e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 11l8-6 8 6v8h-5v-5H9v5H4z"></path></svg>ホーム</div><div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #d6b89e; font-size: 10px; font-weight: 500;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d6b89e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 19h5v-4h5v-4h6"></path></svg>段階表</div><div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #d6b89e; font-size: 10px; font-weight: 500;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d6b89e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"></path></svg>いどむ</div><div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #d6b89e; font-size: 10px; font-weight: 500;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d6b89e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 19V9M11 19V4M18 19v-7"></path></svg>振り返り</div><div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #ff6f3c; font-size: 10px; font-weight: 800;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff6f3c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"></path></svg>設定</div>
  </div>
</div>
